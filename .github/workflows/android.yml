name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir source
          unzip -q "图片文字加解密安卓项目源码.zip" -d source
          find source -maxdepth 3 -type f | head -50

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "没有找到 Gradle 项目，请检查 ZIP 内的文件结构。"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imagecrypt-debug-apk
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
