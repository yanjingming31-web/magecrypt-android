name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract project
      run: |
        echo "====== 第一步：检查当前目录有什么文件 ======"
        ls -la
        
        echo "====== 第二步：开始解压 source.zip ======"
        mkdir -p source
        # 如果这里报错找不到 source.zip，请核对 GitHub 上的文件名是不是完全一致（区分大小写）
        unzip -q source.zip -d source || echo "❌ 解压失败，请检查文件名是否正确，是否在根目录！"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Build APK
      run: |
        echo "====== 第三步：寻找 Gradle 项目 ======"
        # 自动寻找 settings.gradle 所在的目录
        PROJECT_DIR=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
        
        if [ -z "$PROJECT_DIR" ]; then
          echo "❌ 错误：没有找到 Gradle 项目！"
          echo "当前解压后的目录结构如下："
          find source -maxdepth 3 -type f
          exit 1
        fi
        
        echo "✅ 成功找到项目目录: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        chmod +x gradlew
        echo "🚀 开始编译 APK..."
        ./gradlew --no-daemon assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        # 使用通配符寻找生成的 APK，确保路径不会因为中文文件夹而失效
        path: source/**/build/outputs/apk/debug/*.apk
        if-no-files-found: error
